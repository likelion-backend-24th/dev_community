name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dev_community
          MYSQL_USER: dev_community
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Run tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: ./gradlew test --no-daemon

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend test results
          path: backend/build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/build/reports/tests/test
          retention-days: 7

  # 이미지를 배포 서버(GCP e2-micro, RAM 1GB)에서 직접 빌드하면 redis/app이 이미
  # 메모리를 나눠 쓰고 있는 상태에서 Gradle 빌드가 스왑까지 밀려 들어가 사실상
  # 멈춰버리는 문제가 있었음(구 EC2 t2.micro 시절부터 있던 문제, 서버를 옮긴 뒤에도
  # 마찬가지). 빌드는 러너에서 하고 배포 서버는 완성된 이미지를 pull만 하도록 분리.
  # main에 push된 경우에만 실행(PR에서는 빌드/푸시 안 함).
  build-and-push-images:
    name: Build & Push Docker Images
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-app:latest
            ghcr.io/${{ github.repository }}-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 프론트는 Vercel이 소스에서 직접 빌드/배포하므로 더 이상 여기서 이미지를
      # 만들지 않는다. 이 스텝은 TLS 종료 + 리버스 프록시 전용 nginx 이미지를 만든다.
      - name: Build & push nginx image
        uses: docker/build-push-action@v5
        with:
          context: ./nginx
          file: nginx/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-nginx:latest
            ghcr.io/${{ github.repository }}-nginx:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
