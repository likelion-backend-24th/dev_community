name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    # DevCommunityApplicationTests가 @SpringBootTest로 전체 컨텍스트를 띄우면서
    # 실제 MySQL/Redis에 연결하므로, application-ci.yml(spring.profiles.active=ci)의
    # 접속 정보와 동일한 서비스 컨테이너를 붙인다.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: dev_community
          MYSQL_USER: dev_community
          MYSQL_PASSWORD: ci_test_password
          MYSQL_ROOT_PASSWORD: ci_root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Run tests
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: ci
        run: ./gradlew test --no-daemon

      - name: Publish test report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend test results
          path: backend/build/test-results/test/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: backend/build/reports/tests/test
          retention-days: 7
