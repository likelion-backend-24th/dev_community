server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt HTTP-01 webroot 검증용. certbot 컨테이너와 같은 볼륨을 공유한다.
    # PortOne 웹훅이 HTTPS만 지원한다는 요구사항 때문에 추가 (인증서 발급은
    # docker-compose.prod.yml의 certbot 서비스가 처리)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 백엔드 API 프록시 (docker-compose.prod.yml의 app 서비스, 내부 포트 8080)
    # ViewCountService 등 백엔드가 X-Forwarded-For로 실제 클라이언트 IP를 구분하므로
    # 프록시 헤더를 반드시 함께 넘겨줘야 한다.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Swagger UI / OpenAPI 스펙 — 이것도 없으면 SPA 캐치올(location /)에 걸려
    # index.html이 대신 내려감
    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v3/api-docs {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # React Router(SPA) — 정적 파일이 없는 경로는 index.html로 폴백
    location / {
        try_files $uri /index.html;
    }
}
