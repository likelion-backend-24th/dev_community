server {
    listen 80;
    server_name _;
    # Let's Encrypt HTTP-01 웹루트 검증 + 인증서 갱신 시에도 이 경로는 계속 필요.
    # 그 외 모든 요청은 HTTPS로 리다이렉트한다 (PortOne 웹훅이 HTTPS만 지원).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    server_name dev-com.duckdns.org;
    ssl_certificate     /etc/letsencrypt/live/dev-com.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev-com.duckdns.org/privkey.pem;

    # 백엔드 API 프록시 (docker-compose.prod.yml의 app 서비스, 내부 포트 8080)
    # ViewCountService 등 백엔드가 X-Forwarded-For로 실제 클라이언트 IP를 구분하므로
    # 프록시 헤더를 반드시 함께 넘겨줘야 한다.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # Swagger UI / OpenAPI 스펙
    location /swagger-ui/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /v3/api-docs {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 실시간 알림/커리어상담 채팅용 WebSocket(STOMP) 엔드포인트. HTTP/1.1 + Upgrade 헤더를
    # 넘겨야 커넥션이 websocket으로 전환된다.
    location /ws {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # GitHub/Google 로그인 인가 요청. Spring Security가 자동 생성하는
    # /oauth2/authorization/{provider} 경로.
    location /oauth2/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # GitHub/Google 인증 후 돌아오는 콜백 경로 (/login/oauth2/code/{provider})
    location /login/oauth2/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # 프론트가 Vercel로 이전된 뒤로 이 도메인은 API 전용이다. 누군가 루트로 직접
    # 들어오면 실제 프론트로 보내준다(북마크 등으로 옛 주소를 계속 쓰는 경우 대비).
    location / {
        return 302 https://dev-community-neon.vercel.app$request_uri;
    }
}
