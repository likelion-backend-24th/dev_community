spring:
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 10MB

app:
  upload:
    dir: uploads

jwt:
  expirationMs: 900000
  refreshExpirationMs: 1209600000

cookie:
  secure:
    false

admin:
  username: ${ADMIN_USERNAME:}
  password: ${ADMIN_PASSWORD:}
  nickname: ${ADMIN_NICKNAME:관리자}