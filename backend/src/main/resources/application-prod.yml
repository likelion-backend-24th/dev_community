spring:
  config:
    activate:
      on-profile: prod
  datasource:
    # DB_NAME 기본값 dev_community, DB_SSL_MODE 기본값 PREFERRED는 지금(EC2 자체 호스팅 MySQL)
    # 동작을 그대로 유지한다. Aiven 등 관리형 DB로 옮길 때는 .env에서
    # DB_NAME=defaultdb, DB_SSL_MODE=REQUIRED로 바꾼다(Aiven 콘솔의 SSL mode: REQUIRED와 매칭).
    # PREFERRED는 서버가 TLS를 지원하면 자동으로 암호화하고, 아니면 평문으로 접속을 유지하는
    # MySQL Connector/J 기본값이라 지금 EC2 MySQL 컨테이너 설정과 무관하게 안전하다.
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:dev_community}?serverTimezone=Asia/Seoul&sslMode=${DB_SSL_MODE:PREFERRED}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

# 운영 환경에서는 전체 API 스펙이 누구에게나 노출되지 않도록 Swagger/OpenAPI 문서를 끈다.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  upload:
    dir: /app/uploads
  frontend-url: ${FRONTEND_URL}

jwt:
  secret: ${JWT_SECRET}
  refreshSecret: ${JWT_REFRESH}

cookie:
  secure:
    true
  # 프론트를 Vercel 등 별도 도메인으로 옮기는 시점에 .env의 COOKIE_SAME_SITE=None으로
  # 바꾼다(CookieProvider 주석 참고). 지금은 프론트/백엔드가 같은 도메인
  # (dev-com.duckdns.org)이라 기본값 Strict가 맞다.
  same-site: ${COOKIE_SAME_SITE:Strict}

# 프론트를 Vercel 등 별도 도메인으로 옮길 때만 .env의 CORS_ADDITIONAL_ORIGINS에
# 콤마로 구분해 origin을 채운다(CorsConfig 주석 참고). 미설정 시 기존 origin
# 목록만 적용되어 지금 배포는 그대로 동작한다.
cors:
  additional-origins: ${CORS_ADDITIONAL_ORIGINS:}