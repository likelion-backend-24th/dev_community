# GitHub Actions CI 전용 설정.
# application-local.yml은 .gitignore 대상이라 CI 체크아웃 환경에는 존재하지 않으므로,
# 워크플로우(.github/workflows/ci.yml)의 MySQL/Redis 서비스 컨테이너 값에 맞춘
# 이 파일을 대신 사용한다. 아래 계정/시크릿은 CI 잡 안에서만 쓰는 더미 값이며
# 실제 운영/로컬 값과는 무관하다.
