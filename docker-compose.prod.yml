services:
  redis:
    image: redis:7
    container_name: dev_community_redis
    networks:
      - app-network

  app:
    # 이미지는 새 서버에서 빌드하지 않고 GitHub Actions가 빌드해서 GHCR에 올린 걸 pull만 한다.
    # (배포 스크립트가 이 파일 그대로 --build 없이 pull + up만 실행)
    image: ghcr.io/likelion-backend-24th/dev_community-app:latest
    container_name: dev_community_app
    # 호스트에 포트를 열지 않는다 — nginx만 app-network를 통해 8080으로 접근하고,
    # 외부에서는 반드시 nginx의 HTTPS 경유로만 API에 닿아야 한다.
    volumes:
      - uploads_dev_community:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # DB는 이 서버가 아니라 Aiven(관리형 MySQL)을 쓴다. .env에 실제 값을 채운다.
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_SSL_MODE: ${DB_SSL_MODE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH: ${JWT_REFRESH}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET}
      PORTONE_WEBHOOK_NOTICE_URL: ${PORTONE_WEBHOOK_NOTICE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # 프론트가 Vercel(별도 도메인)에서 서빙되므로 반드시 채워야 한다(콤마 구분 가능).
      CORS_ADDITIONAL_ORIGINS: ${CORS_ADDITIONAL_ORIGINS}
      # 프론트/백엔드가 서로 다른 도메인이라 None이어야 로그인 쿠키가 유지된다.
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE}
    depends_on:
      redis:
        condition: service_started
    networks:
      - app-network

  nginx:
    # TLS 종료 + API/WebSocket/OAuth 리버스 프록시 전용. 프론트 정적 파일은 더 이상
    # 여기서 서빙하지 않는다(Vercel이 담당). ./nginx/Dockerfile, ./nginx/nginx.conf 참고.
    image: ghcr.io/likelion-backend-24th/dev_community-nginx:latest
    container_name: dev_community_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - app-network

  # HTTPS 인증서(Let's Encrypt) 발급/자동 갱신. PortOne 웹훅이 HTTPS 엔드포인트만
  # 받는다는 요구사항 때문에 추가. entrypoint가 renew 무한루프로 고정돼 있어서
  # 새 도메인에 대해 최초 인증서를 발급하려면(=certonly) 그 entrypoint를
  # 반드시 아래처럼 명시적으로 덮어써야 한다 — 안 그러면 내가 넘긴 certonly
  # 인자가 무시되고 renew 루프만 그대로 실행된다(겪어본 문제):
  #   docker compose -f docker-compose.prod.yml run --rm --entrypoint certbot certbot \
  #     certonly --webroot -w /var/www/certbot -d <도메인> --email <이메일> \
  #     --agree-tos --no-eff-email --non-interactive
  # 발급 후엔 nginx/nginx.conf에 443 서버 블록을 추가해야 하고(인증서 없이 먼저
  # 배포하면 nginx가 기동 실패함), 그 이후엔 이 서비스가 12시간마다 자동
  # 갱신을 시도한다.
  certbot:
    image: certbot/certbot
    container_name: dev_community_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  uploads_dev_community:
  certbot_certs:
  certbot_www:

networks:
  app-network:
    driver: bridge
