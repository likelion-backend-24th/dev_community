services:
  mysql:
    image: mysql:8.0
    container_name: dev_community_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: dev_community
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_dev_community:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: dev_community_redis
    networks:
      - app-network

  app:
    # 이미지는 EC2에서 빌드하지 않고 GitHub Actions가 빌드해서 GHCR에 올린 걸 pull만 한다.
    # (배포 스크립트가 이 파일 그대로 --build 없이 pull + up만 실행)
    image: ghcr.io/likelion-backend-24th/dev_community-app:latest
    container_name: dev_community_app
    # 호스트에 포트를 열지 않는다 — nginx(frontend 서비스)만 app-network를 통해
    # 8080으로 접근하고, 외부에서는 반드시 nginx의 HTTPS 경유로만 API에 닿아야 한다.
    # (예전엔 여기서 8080:8080으로 호스트에 직접 노출해서, 평문 HTTP로 로그인 등
    # API를 nginx/TLS 없이 바로 호출할 수 있었던 문제가 있었음)
    volumes:
      - uploads_dev_community:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH: ${JWT_REFRESH}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET}
      PORTONE_WEBHOOK_NOTICE_URL: ${PORTONE_WEBHOOK_NOTICE_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      FRONTEND_URL: ${FRONTEND_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # 프론트를 Vercel 등 별도 도메인으로 옮길 때만 .env에 값을 채운다(콤마 구분 origin,
      # 예: https://dev-community.vercel.app / SameSite는 None). 미설정 시 기본값이
      # 적용되어 지금 배포는 그대로 동작한다. 실제 기본값은 application-prod.yml 참고.
      CORS_ADDITIONAL_ORIGINS: ${CORS_ADDITIONAL_ORIGINS:-}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  frontend:
    image: ghcr.io/likelion-backend-24th/dev_community-frontend:latest
    container_name: dev_community_frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot_www:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - app-network

  # HTTPS 인증서(Let's Encrypt) 발급/자동 갱신. PortOne 웹훅이 HTTPS 엔드포인트만
  # 받는다는 요구사항 때문에 추가. entrypoint가 renew 무한루프로 고정돼 있어서
  # 새 도메인에 대해 최초 인증서를 발급하려면(=certonly) 그 entrypoint를
  # 반드시 아래처럼 명시적으로 덮어써야 한다 — 안 그러면 내가 넘긴 certonly
  # 인자가 무시되고 renew 루프만 그대로 실행된다(겪어본 문제):
  #   docker compose -f docker-compose.prod.yml run --rm --entrypoint certbot certbot \
  #     certonly --webroot -w /var/www/certbot -d <도메인> --email <이메일> \
  #     --agree-tos --no-eff-email --non-interactive
  # 발급 후엔 nginx.conf에 443 서버 블록을 추가해야 하고(인증서 없이 먼저
  # 배포하면 nginx가 기동 실패함), 그 이후엔 이 서비스가 12시간마다 자동
  # 갱신을 시도한다.
  certbot:
    image: certbot/certbot
    container_name: dev_community_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_dev_community:
  uploads_dev_community:
  certbot_certs:
  certbot_www:

networks:
  app-network:
    driver: bridge
