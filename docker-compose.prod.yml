services:
  mysql:
    image: mysql:8.0
    container_name: dev_community_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: dev_community
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_dev_community:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: dev_community_redis
    networks:
      - app-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dev_community_app
    ports:
      - "8080:8080"
    volumes:
      - uploads_dev_community:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH: ${JWT_REFRESH}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NICKNAME: ${ADMIN_NICKNAME}
      PORTONE_API_SECRET: ${PORTONE_API_SECRET}
      PORTONE_STORE_ID: ${PORTONE_STORE_ID}
      PORTONE_CHANNEL_KEY: ${PORTONE_CHANNEL_KEY}
      PORTONE_WEBHOOK_SECRET: ${PORTONE_WEBHOOK_SECRET}
      PORTONE_WEBHOOK_NOTICE_URL: ${PORTONE_WEBHOOK_NOTICE_URL}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dev_community_frontend
    ports:
      - "80:80"
    volumes:
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
    networks:
      - app-network

  # HTTPS 인증서(Let's Encrypt) 발급/자동 갱신. PortOne 웹훅이 HTTPS 엔드포인트만
  # 받는다는 요구사항 때문에 추가. 최초 인증서 발급은 EC2에서
  # `docker compose -f docker-compose.prod.yml run --rm certbot certonly --webroot
  #   -w /var/www/certbot -d <도메인> --email <이메일> --agree-tos --no-eff-email`
  # 을 한 번 수동 실행해야 하고, 그 이후엔 이 서비스가 12시간마다 자동 갱신을 시도한다.
  certbot:
    image: certbot/certbot
    container_name: dev_community_certbot
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  mysql_dev_community:
  uploads_dev_community:
  certbot_certs:
  certbot_www:

networks:
  app-network:
    driver: bridge
